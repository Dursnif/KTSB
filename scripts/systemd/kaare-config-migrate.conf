# Bare-metal installs: run the config migration before the main API starts (P134) — the same runner every Docker
# container uses, so missing keys from a new release reach configs/ here too. Snapshot first, one migration,
# a normal start writes nothing.
#
# Install as a drop-in for kaare.service:
#   sudo mkdir -p /etc/systemd/system/kaare.service.d
#   sudo cp /kaare/scripts/systemd/kaare-config-migrate.conf /etc/systemd/system/kaare.service.d/
#   sudo systemctl daemon-reload
# Preview first (writes nothing):
#   sudo -u kaare /kaare/venv/bin/python /kaare/scripts/migrate_configs.py --dry-run
[Service]
ExecStartPre=/kaare/venv/bin/python /kaare/scripts/migrate_configs.py
