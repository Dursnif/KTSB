name: Build and push Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A tag with a suffix (v1.11.0-rc1) is a test run: images get only that tag (never :latest) and the GitHub Release is
# marked as a pre-release, which the in-app updater never offers.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the workflow's OIDC identity signs each image digest.
      # The in-app updater verifies that identity before it installs a release.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      # ── Main API image ───────────────────────────────────────────────────────────

      - name: Metadata — kaare
        id: meta-kaare
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dursnif/kaare
          # metadata-action adds :latest on every git tag by default (latest=auto) — off; the raw rule below decides:
          # only a release tag (vX.Y.Z, no suffix) sets :latest — a main push built :latest with version «latest» and
          # raced the tag run (v1.10.1, 2026-10-11).
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push kaare
        id: build-kaare
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-kaare.outputs.tags }}
          build-args: |
            KTSB_VERSION=${{ steps.meta-kaare.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=kaare
          cache-to: type=gha,mode=max,scope=kaare

      - name: Sign kaare
        run: cosign sign --yes ghcr.io/dursnif/kaare@${{ steps.build-kaare.outputs.digest }}

      # ── Embedding image (BGE-M3, CPU-only torch) ─────────────────────────────────

      - name: Metadata — kaare-embedding
        id: meta-embedding
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dursnif/kaare-embedding
          # metadata-action adds :latest on every git tag by default (latest=auto) — off; the raw rule below decides.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push kaare-embedding
        id: build-embedding
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.embedding
          push: true
          tags: ${{ steps.meta-embedding.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=kaare-embedding
          cache-to: type=gha,mode=max,scope=kaare-embedding

      - name: Sign kaare-embedding
        run: cosign sign --yes ghcr.io/dursnif/kaare-embedding@${{ steps.build-embedding.outputs.digest }}

      # ── Voice image (faster-whisper, ffmpeg, Piper TTS) ──────────────────────────

      - name: Metadata — kaare-voice
        id: meta-voice
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dursnif/kaare-voice
          # metadata-action adds :latest on every git tag by default (latest=auto) — off; the raw rule below decides.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push kaare-voice
        id: build-voice
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.voice
          push: true
          tags: ${{ steps.meta-voice.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=kaare-voice
          cache-to: type=gha,mode=max,scope=kaare-voice

      - name: Sign kaare-voice
        run: cosign sign --yes ghcr.io/dursnif/kaare-voice@${{ steps.build-voice.outputs.digest }}

      # ── Frontend image (React/Vite → nginx) ──────────────────────────────────────

      - name: Metadata — kaare-frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dursnif/kaare-frontend
          # metadata-action adds :latest on every git tag by default (latest=auto) — off; the raw rule below decides.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push kaare-frontend
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=kaare-frontend
          cache-to: type=gha,mode=max,scope=kaare-frontend

      - name: Sign kaare-frontend
        run: cosign sign --yes ghcr.io/dursnif/kaare-frontend@${{ steps.build-frontend.outputs.digest }}

      # ── Inner voices image (Jing/Jang, OpenVINO) ─────────────────────────────────
      # Prebuilt so installs without a source checkout can run the inner_voices profile.

      - name: Metadata — kaare-inner-voices
        id: meta-inner-voices
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dursnif/kaare-inner-voices
          # metadata-action adds :latest on every git tag by default (latest=auto) — off; the raw rule below decides.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push kaare-inner-voices
        id: build-inner-voices
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inner_voices
          push: true
          tags: ${{ steps.meta-inner-voices.outputs.tags }}
          build-args: |
            PROVIDER=openvino
          provenance: false
          cache-from: type=gha,scope=kaare-inner-voices
          cache-to: type=gha,mode=max,scope=kaare-inner-voices

      - name: Sign kaare-inner-voices
        run: cosign sign --yes ghcr.io/dursnif/kaare-inner-voices@${{ steps.build-inner-voices.outputs.digest }}

      # ── Updater image (in-app updates) ───────────────────────────────────────────

      - name: Metadata — kaare-updater
        id: meta-updater
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dursnif/kaare-updater
          # metadata-action adds :latest on every git tag by default (latest=auto) — off; the raw rule below decides.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push kaare-updater
        id: build-updater
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.updater
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          build-args: |
            KTSB_VERSION=${{ steps.meta-updater.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=kaare-updater
          cache-to: type=gha,mode=max,scope=kaare-updater

      - name: Sign kaare-updater
        run: cosign sign --yes ghcr.io/dursnif/kaare-updater@${{ steps.build-updater.outputs.digest }}

  # ── Install bundle + GitHub release (tags only) ──────────────────────────────
  # Everything a Docker install needs besides the images and the user's data folders.
  # The in-app updater downloads this bundle, checks SHA256SUMS and swaps the files.
  release-bundle:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Assemble bundle
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          B="ktsb-docker-${TAG}"
          mkdir -p "dist/${B}"
          cp docker-compose.yml docker-compose.gpu.yml .env.example setup.sh setup.ps1 "dist/${B}/"
          cp -r docker "dist/${B}/docker"
          echo "${TAG}" > "dist/${B}/VERSION"
          tar -C dist -czf "dist/${B}.tar.gz" "${B}"
          (cd dist && sha256sum "${B}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS
          # SHA256SUMS only proves the download is intact; the signature proves our workflow made it.
          cosign sign-blob --yes --bundle "dist/${B}.tar.gz.sigstore.json" "dist/${B}.tar.gz"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PRE=""
          case "${TAG}" in *-*) PRE="--prerelease" ;; esac
          gh release view "${TAG}" >/dev/null 2>&1 \
            || gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes ${PRE}
          gh release upload "${TAG}" "dist/ktsb-docker-${TAG}.tar.gz" \
            "dist/ktsb-docker-${TAG}.tar.gz.sigstore.json" dist/SHA256SUMS --clobber
