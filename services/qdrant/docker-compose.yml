services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # pinned (P145, 2026-10-27_170808) — change deliberately, test in testbase first
    container_name: kaare-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - /kaare/state/qdrant:/qdrant/storage
    env_file:
      - path: /kaare/configs/qdrant.env
        required: false
