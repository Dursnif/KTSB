# KTSB – Alias configuration
# Maps the names people say (any language) to the things KTSB can control.
# Edit this file through the admin GUI (Rom og aliaser → Aliaser) or directly here.
#
# How it works:
#   When a user says "turn on the floor lamp", KTSB looks up "floor lamp" (in whatever language it was said)
#   and maps it to the thing it names. A bare entity_id (light.x) is a Home Assistant entity.
#
# Places and floors live in rooms.yaml (P137) — with Home Assistant connected they come from HA's areas.
# rooms / room_entities below are the pre-P137 format: still read until every reader uses rooms.yaml, copied
# into rooms.yaml once by the config migration, and empty for new installs.
# -------------------------------------------------------

rooms: {}
room_entities: {}

# Add your custom aliases via the admin GUI.
# Example:
#   "floor lamp":      light.living_room_floor_lamp
#   "coffee maker":    switch.kitchen_coffee_maker
#   "front door lock": lock.front_door
aliases: {}
