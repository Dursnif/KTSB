server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # index.html and the few unhashed files (manifest.json, vite.svg): the browser must ask every time, or an updated
    # KTSB keeps showing the old GUI (DT04 R0.8). «no-cache» = revalidate; an unchanged file is answered with 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite's build output: every file name carries a content hash, so it can be cached for good.
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
