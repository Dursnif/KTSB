name: kaare

# Own images are pinned by KTSB_VERSION in .env (set by setup and by the in-app updater).
# Without it they fall back to :latest, as before.

volumes:
  ollama_models:
  bge_model:

services:

  # ── Infrastructure ────────────────────────────────────────────────────────────

  qdrant:
    image: qdrant/qdrant:v1.19.2   # pinned (DT03) — must match qdrant-client 1.19.x
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes:
      - ./state/qdrant:/qdrant/storage
    env_file:
      - path: ./configs/qdrant.env
        required: false

  # Built-in Ollama — optional (~10 GB image).
  # Enabled by default via COMPOSE_PROFILES=ollama in .env.
  # Remove "ollama" from COMPOSE_PROFILES if you have your own LLM server.
  ollama:
    image: ollama/ollama:0.35.1    # pinned (DT03), bump deliberately each release
    restart: unless-stopped
    # not published (P120): only KTSB's containers use it, by name (http://ollama:11434)
    volumes:
      - ollama_models:/root/.ollama
    profiles: [ollama]

  caddy:
    image: caddy:2.11.7            # pinned (DT03)
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      KAARE_DOMAIN: ${KAARE_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/caddy_data:/data
      - ./state/caddy_config:/config

  # Default web search engine (P121): self-hosted metasearch, no API key. Internal only —
  # kaare-api reaches it as http://searxng:8080 (configs_default/services.yaml web_search).
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555   # pinned (DT03)
    restart: unless-stopped
    # not published: only kaare-api talks to it
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./docker/searxng:/etc/searxng:ro

  # ── Main API image (all kaare-* services use the same image) ─────────────────

  kaare-api:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: unless-stopped
    ports: ["8000:8000"]
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./data:/kaare/data
      - ./logs:/kaare/logs
      # Models downloaded from the GUI (settings.yaml models_dir, default /kaare/models)
      - ./models:/kaare/models
      # Lets the admin GUI's "Restart" buttons restart sibling containers
      # (embedding, voice, argus, ...) — see router_system.py's _IN_DOCKER path.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      qdrant:
        condition: service_started
      # Optional: ollama is only defined when the "ollama" profile is active.
      # Users with their own LLM server drop it from COMPOSE_PROFILES (Compose >= v2.20).
      ollama:
        condition: service_started
        required: false
      searxng:
        condition: service_started

  kaare-ha-gateway:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: unless-stopped
    # not published (P120): only kaare-api calls the gateway, by name (http://kaare-ha-gateway:8002)
    command: uvicorn kaare_ha_gateway:app --host 0.0.0.0 --port 8002 --no-proxy-headers
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./logs:/kaare/logs

  kaare-semantic-embed:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: on-failure
    # not published (P120): internal, reached by name
    command: python server.py
    working_dir: /kaare/semantic_embed
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./models:/kaare/models

  kaare-argus:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: unless-stopped
    command: python kaare_argus.py
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./logs:/kaare/logs
    depends_on: [qdrant]

  # Night sequence (nightjob, Lovdata, portrait, knowledge review, reflection, dev slot) once per
  # night at the start time set in the GUI (Settings → Reflection). Name kept from the old
  # reflection-only runner so upgrades leave no orphan container.
  kaare-reflection:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: unless-stopped
    command: python kaare_night_runner.py
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./logs:/kaare/logs
    depends_on: [kaare-api]

  kaare-ha-log-bridge:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: unless-stopped
    command: python services/ha_log_bridge/ha_log_bridge.py
    volumes:
      - ./configs:/kaare/configs
      - ./logs:/kaare/logs

  kaare-frontend:
    image: ghcr.io/dursnif/kaare-frontend:${KTSB_VERSION:-latest}
    restart: unless-stopped
    ports: ["5173:80"]

  # ── VPN (optional — add "vpn" to COMPOSE_PROFILES to enable) ─────────────────
  # Requires: open UDP 51820 in your router, set WG_HOST and WG_PASSWORD_HASH in .env
  # Web UI for adding clients: http://your-ip:51821
  # WireGuard subnet must match vpn_subnet in configs/settings.yaml (default: 10.0.0.0/24)
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${WG_PASSWORD_HASH}
      WG_DEFAULT_ADDRESS: "10.0.0.x"
      WG_DEFAULT_DNS: "1.1.1.1"
      WG_PORT: 51820
      PORT: 51821
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    volumes:
      - ./state/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    profiles: [vpn]

  # In-app updates (P57): «Oppdater KTSB» on the Maintenance page installs a newer signed release, checks it and
  # rolls back on failure. Needs KTSB_HOME / KTSB_HOME_HOST in .env (written by setup.sh / setup.ps1); without them
  # it stays idle and the GUI says so.
  kaare-updater:
    image: ghcr.io/dursnif/kaare-updater:${KTSB_VERSION:-latest}
    restart: unless-stopped
    stop_grace_period: 5s
    environment:
      - KTSB_HOME=${KTSB_HOME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./state/updater:/run/ktsb-updater
      - ${KTSB_HOME_HOST:-./state/updater/unconfigured}:${KTSB_HOME:-/ktsb-unconfigured}

  # Night job — run manually: docker compose run --rm kaare-nightjob
  kaare-nightjob:
    image: ghcr.io/dursnif/kaare:${KTSB_VERSION:-latest}
    restart: "no"
    command: python kaare_nightjob.py
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./data:/kaare/data
      - ./logs:/kaare/logs
    profiles: [manual]

  # ── Optional services (activate via COMPOSE_PROFILES in .env) ────────────────

  # profiles: [medium, full]
  kaare-embedding:
    image: ghcr.io/dursnif/kaare-embedding:${KTSB_VERSION:-latest}
    restart: unless-stopped
    # not published (P120): internal, reached by name (http://kaare-embedding:11446)
    volumes:
      - ./configs:/kaare/configs
      - bge_model:/kaare/models/bge-m3
    profiles: [medium, full]

  # profiles: [full]
  kaare-voice:
    image: ghcr.io/dursnif/kaare-voice:${KTSB_VERSION:-latest}
    restart: unless-stopped
    ports: ["8011:8011"]
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./models:/kaare/models
    profiles: [full]

  kaare-jing:
    image: ghcr.io/dursnif/kaare-inner-voices:${KTSB_VERSION:-latest}
    restart: unless-stopped
    command: ["python3", "jing_runner.py"]
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./services/inner_voices/models:/kaare/services/inner_voices/models
      - ./services/inner_voices/ov_cache:/kaare/services/inner_voices/ov_cache
    profiles: [inner_voices]

  kaare-jang:
    image: ghcr.io/dursnif/kaare-inner-voices:${KTSB_VERSION:-latest}
    restart: unless-stopped
    command: ["python3", "jang_runner.py"]
    volumes:
      - ./configs:/kaare/configs
      - ./state:/kaare/state
      - ./services/inner_voices/models:/kaare/services/inner_voices/models
      - ./services/inner_voices/ov_cache:/kaare/services/inner_voices/ov_cache
    profiles: [inner_voices]
