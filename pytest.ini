[pytest]
# .ssh/ is owned by the system user "kaare", not readable by the user running pytest —
# a bare `pytest` from /kaare root otherwise crashes collection entirely trying to stat it.
norecursedirs = .ssh

# Live-data health probes (tests/test_rid_health.py) read this install's production logs, so
# they fail on a fresh clone and whenever a stress test was slow — not part of the default run.
# Run them on demand with: pytest -m live
markers =
    live: reads real production logs/state; excluded from the default run
addopts = -m "not live"
